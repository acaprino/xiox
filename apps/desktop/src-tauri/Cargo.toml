[package]
name = "xiox-ui"
version = "0.4.2"
edition = "2024"
description = "Xiox desktop window (Tauri): the cleanup, registry and developer sections over xiox-core"
publish = false

[[bin]]
name = "xiox-ui"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
xiox-app = { path = "../../../crates/xiox-app" }
xiox-core = { path = "../../../crates/xiox-core" }
tauri = { version = "=2.12.5", features = [] }
# The window the apps of the suite share, as a Tauri plugin: its material and theme, glass, Snap Layouts, the guard, WebView2 recovery,
# its place, the title and the taskbar, one running copy. The tag is the one @acaprino/imago has in package.json.
imago-shell = { git = "https://github.com/acaprino/imago", tag = "v1.2.0" }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
