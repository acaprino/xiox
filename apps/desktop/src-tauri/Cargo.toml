[package]
name = "xiox-ui"
version = "0.1.0"
edition = "2024"
description = "Xiox desktop window (Tauri): the cleanup, registry, services and developer sections over xiox-core"
publish = false

[[bin]]
name = "xiox-ui"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
xiox-app = { path = "../../../crates/xiox-app" }
xiox-core = { path = "../../../crates/xiox-core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
