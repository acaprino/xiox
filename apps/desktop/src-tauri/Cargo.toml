[package]
name = "xiox-ui"
version = "0.2.1"
edition = "2024"
description = "Xiox desktop window (Tauri): the cleanup, registry, services and developer sections over xiox-core"
publish = false

[[bin]]
name = "xiox-ui"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
xiox-app = { path = "../../../crates/xiox-app" }
xiox-core = { path = "../../../crates/xiox-core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Win32_Graphics_Gdi, Win32_System_LibraryLoader, Win32_UI_HiDpi, Win32_UI_Input_KeyboardAndMouse: the snap layouts overlay of
# the page's maximize button (src/native_frame.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
# The WebView2 settings and events Tauri does not expose (src/desktop.rs): the versions tauri-runtime-wry already resolves.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[dev-dependencies]
tempfile = "3.27.0"
