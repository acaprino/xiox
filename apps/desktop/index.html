<!doctype html>
<html lang="en" data-skin="smooth">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><link rel="icon" href="data:,">
  <title>Xiox</title>
  <!-- The stage colour before any stylesheet or script: the first frame is the window's own background
       (tauri.conf.json backgroundColor, tokens.css --stage), never white or the engine's dark grey. -->
  <style>html, body { background: #0b0416; }</style>
</head>
<body>
  <main id="app">
    <div id="status"><span id="badge"></span><span id="status-text" role="status" aria-atomic="true"></span><span id="status-right"></span></div>
    <div id="job" hidden></div>
    <div id="profile" hidden></div>
    <div id="body">
      <nav id="sections" class="frame" aria-label="Sections"></nav>
      <aside id="bar2" class="frame"></aside>
      <section id="main" class="frame">
        <div id="notices"></div>
        <div id="list-head" class="hd"></div>
        <div id="rows"></div>
        <div id="detail"></div>
      </section>
    </div>
    <!-- After the panes in the DOM so that Tab reaches the sections, the bars, the list and the detail first and the top-bar actions last; the grid rows of shell.css keep it on top. -->
    <header id="top">
      <!-- Smooth's title bar (the window has no system frame then): this strip drags the window and its double click maximizes;
           what sits on it (the brand, the tabs, the switches, the window buttons) is above it. ONI MODE hides it, its frame is the system's. -->
      <div id="titlebar" data-tauri-drag-region></div>
      <img id="wordmark" src="/xiox-wordmark.png" alt="Xiox" draggable="false">
      <span id="brand" aria-hidden="true"><i class="brand-mark"></i>Xiox</span>
      <span id="version"></span>
      <span class="spring"></span>
      <div id="actions"></div>
      <!-- Smooth's theme (src/skin.ts), after the actions in the Tab order: Windows, light, dark (main.ts keeps aria-pressed
           in step; ONI MODE, chosen in Settings, hides it: it is always dark). -->
      <div id="look">
        <div id="theme" role="group" aria-label="Theme">
          <button type="button" class="theme-choice" data-theme-choice="system" aria-pressed="true" data-key="theme:system" title="Follow the Windows theme">Auto</button>
          <button type="button" class="theme-choice" data-theme-choice="light" aria-pressed="false" data-key="theme:light" title="Always light">Light</button>
          <button type="button" class="theme-choice" data-theme-choice="dark" aria-pressed="false" data-key="theme:dark" title="Always dark">Dark</button>
        </div>
      </div>
      <!-- The window buttons of Smooth's title bar (src/window-controls.ts); Windows' snap layouts sit over the maximize one. -->
      <div id="caption" role="group" aria-label="Window controls">
        <button id="window-minimize" type="button" aria-label="Minimize window" title="Minimize" data-key="window:minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg>
        </button>
        <button id="window-maximize" type="button" aria-label="Maximize window" title="Maximize" data-key="window:maximize">
          <svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9"/></svg>
          <svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M5.5 5.5v-3h8v8h-3"/><rect x="2.5" y="5.5" width="8" height="8"/></svg>
        </button>
        <button id="window-close" type="button" aria-label="Close window" title="Close" data-key="window:close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>
    <footer id="foot"></footer>
    <div id="modal" hidden></div>
    <div id="about" hidden></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
