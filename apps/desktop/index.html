<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><link rel="icon" href="data:,">
  <title>Xiox</title>
  <!-- The stage colour before any stylesheet or script: the first frame is the window's own background
       (tauri.conf.json backgroundColor, tokens.css --stage), never white or the engine's dark grey. -->
  <style>html, body { background: #0b0416; }</style>
</head>
<body>
  <main id="app">
    <div id="status"><span id="badge"></span><span id="status-text"></span><span id="status-right"></span></div>
    <div id="job" hidden></div>
    <div id="profile" hidden></div>
    <div id="body">
      <nav id="sections" class="frame" aria-label="Sections"></nav>
      <aside id="bar2" class="frame"></aside>
      <section id="main" class="frame">
        <div id="notices"></div>
        <div id="list-head" class="hd"></div>
        <div id="rows"></div>
        <div id="detail"></div>
      </section>
    </div>
    <!-- After the panes in the DOM so that Tab reaches the sections, the bars, the list and the detail first and the top-bar actions last; the grid rows of shell.css keep it on top. -->
    <header id="top">
      <img id="wordmark" src="/xiox-wordmark.png" alt="Xiox" draggable="false">
      <span id="version"></span>
      <span class="spring"></span>
      <div id="actions"></div>
    </header>
    <footer id="foot"></footer>
    <div id="modal" hidden></div>
    <div id="about" hidden></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
