[workspace]
resolver = "3"
members = [".", "crates/*"]

[package]
name = "pulisci-pc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "PulisciPC"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
