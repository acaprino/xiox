[workspace]
resolver = "3"
members = [".", "crates/*"]

[package]
name = "xiox-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xiox-ui"
path = "src/main.rs"

[dependencies]
xiox-app = { path = "crates/xiox-app" }
xiox-cleaner = { path = "crates/xiox-cleaner" }
xiox-model = { path = "crates/xiox-model" }
xiox-mukade = { path = "crates/xiox-mukade" }
xiox-sessions = { path = "crates/xiox-sessions" }
xiox-rules = { path = "crates/xiox-rules" }
xiox-core = { path = "crates/xiox-core" }
rfd = "0.15"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
