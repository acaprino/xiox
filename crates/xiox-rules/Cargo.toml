[package]
name = "xiox-rules"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
roxmltree = "0.20"
xiox-model = { path = "../xiox-model" }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
# Solo per l'esempio `winapp2_real` (misura della memoria del processo).
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization"] }
