; Version: 260915
; # of entries: 4,068
;
; Campione scritto a mano nella forma di Winapp2.ini (nomi e percorsi inventati).

[Alpha Cache *]
LangSecRef=3025
Section=Alpha Suite
DetectFile=%LocalAppData%\Alpha
FileKey1=%LocalAppData%\Alpha\Cache|*.log;*.tmp|RECURSE
FileKey2=%LocalAppData%\Alpha\Logs|*.*

[Beta Temp *]
LangSecRef=3026
DetectFile=%AppData%\Beta
FileKey1=%AppData%\Beta\Temp|*.*|REMOVESELF

[Gamma Registry *]
Section=Gamma Browser
Detect=HKCU\Software\Gamma
RegKey1=HKCU\Software\Gamma\MRU
RegKey2=HKCU\Software\Gamma\Settings|LastFile

[Delta Keep *]
DetectFile=%AppData%\Delta
FileKey1=%AppData%\Delta\Cache|*.*|RECURSE
ExcludeKey1=FILE|%AppData%\Delta\Cache|keep.dat

[Epsilon Warn *]
Warning=Questa voce cancella anche le impostazioni dell'applicazione.
Default=False
DetectFile=%AppData%\Epsilon
FileKey1=%AppData%\Epsilon\Data|*.bak

[Zeta No Detect *]
FileKey1=%AppData%\Zeta\Cache|*.*

[Eta Unknown *]
SpecialDetect=DET_ETA
FutureKey1=qualcosa
FutureKey2=altro
DetectFile=%AppData%\Eta
FileKey1=%AppData%\Eta\Cache|*.*|RECURSE

[Theta Profile *]
DetectFile=%UserProfile%\.theta
FileKey1=%UserProfile%|*.*|RECURSE

[Iota Machine *]
Default=True
Detect=HKLM\Software\Iota
RegKey1=HKLM\Software\Iota\Cache
FileKey1=%ProgramData%\Iota\Logs|*.log

[Kappa Missing Var *]
DetectFile=%AppData%\Kappa
FileKey1=%NOPE%\Kappa\Cache|*.*|RECURSE
FileKey2=%AppData%\Kappa\Cache|*.old

[Lambda Hku *]
Detect=HKU\.DEFAULT\Software\Lambda
RegKey1=HKU\.DEFAULT\Software\Lambda\Cache
RegKey2=HKCU\Control Panel\Lambda

[Mu Plain]
DetectFile=%AppData%\Mu|mu.exe
FileKey1=%AppData%\Mu\Cache|*.*|RECURSE
