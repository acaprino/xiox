[package]
name = "xiox-cleaner"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
xiox-model = { path = "../xiox-model" }
xiox-scanner = { path = "../xiox-scanner" }
rayon = "1.12.0"
trash = "5.3.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_RestartManager",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.27.0"
