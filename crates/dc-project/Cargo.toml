[package]
name = "dc-project"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
dc-model = { path = "../dc-model" }
dc-git = { path = "../dc-git" }
dc-engine = { path = "../dc-engine" }
dc-scanner = { path = "../dc-scanner" }
dc-app = { path = "../dc-app" }
dc-mukade = { path = "../dc-mukade" }
dc-cleaner = { path = "../dc-cleaner" }
dc-sessions = { path = "../dc-sessions" }
dc-disktree = { path = "../dc-disktree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.27.0"
