[package]
name = "xiox-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "xiox"
path = "src/main.rs"

[dependencies]
xiox-model = { path = "../xiox-model" }
xiox-observer = { path = "../xiox-observer" }
xiox-project = { path = "../xiox-project" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27.0"
