[package]
name = "xiox-mukade"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"

[features]
# The synthetic store writer of `test_support`, for dev-dependents.
test-support = []

[dependencies]
xiox-model = { path = "../xiox-model" }
# mukade (MIT, same author) is used as a prebuilt executable, vendor/mukade/mukade.exe: no source.
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Same pinned version as xiox-core: two versions cannot coexist (libsqlite3-sys).
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OpenCode database copy that `dump_calls` reads.
tempfile = "3.27.0"

