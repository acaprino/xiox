# ---- calls with literal paths inside scripts; anything not literal gives nothing
[[event]]
id = "x10"
cat = "script"
shell = "bash"
cmd = '''
python - <<'EOF'
import json, shutil
from pathlib import Path
data = json.load(open("plan.json"))
Path("D:/runs/plan-out").mkdir(parents=True, exist_ok=True)
open(f"{base}/skip.txt", "w")
shutil.copytree("fixtures", "D:/runs/plan-out/fixtures")
EOF'''
gold = [{ op = "create", dst = 'D:\runs\plan-out' }, { op = "copy", dst = 'D:\runs\plan-out\fixtures' }]

