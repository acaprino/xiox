# Shell events from agent sessions, labelled by hand. Synthetic: no real session is quoted.
# Each event: the command a tool ran, its shell, the working directory, the exit code (Xiox links the
# outcome, the extractor never sees it) and `gold`, the paths that result once resolved against `cwd`.
# Gold is the truth of what the command does to disk, so a loop that makes seed-1..3 lists all three,
# and a path behind an unknown variable lists nothing. `cd` is context, never a candidate.
# op: create (new directory or project), copy (copy or extract src into dst), move, clone,
# worktree, write (a file, or a directory a tool writes its output to).

[defaults]
cwd = 'D:\Projects\Phazly'
home = 'C:\Users\dev'
temp = 'C:\Users\dev\AppData\Local\Temp'

