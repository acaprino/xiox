[package]
name = "xiox-disktree"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
xiox-model = { path = "../xiox-model" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
xiox-cleaner = { path = "../xiox-cleaner" }

# Only for examples/peak.rs (admin check, peak working set); not part of the library build.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
