[package]
name = "mukade"
description = "Move a coding-agent session between Claude Code, Codex CLI, OpenCode and Pi, as one of the destination's own. (vendored library-only copy, see VENDORED.md)"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/acaprino/mukade"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

# Same dependency list as upstream, minus build-dependencies (upstream's build.rs only embeds a
# Windows icon/manifest for its own CLI binary, which this copy does not build).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
